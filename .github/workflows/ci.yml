name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux tray dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            pkg-config \
            libclang-dev

      - name: Build UI
        working-directory: ui
        run: npm ci && npm run build

      - name: UI smoke
        run: |
          npm install --no-save --prefix ui playwright@1.55.0
          npx --yes --prefix ui playwright install --with-deps chromium
          node scripts/ui-smoke.mjs
      - name: Check Rust
        run: cargo check -p orbitry-core -p orbitry
